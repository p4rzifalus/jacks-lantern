<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Осенняя ферма</title>
    <meta name="description" content="Уютный вечерний огород с енотом: посади, полей, собери урожай и открой новые семена. Играется в браузере — на компьютере и телефоне." />

    <!-- Иконки вкладки и домашнего экрана телефона -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#171722" />

    <!-- Превью ссылки в соцсетях и мессенджерах (картинка — полный адрес, так требуют соцсети) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Осенняя ферма" />

    <meta name="twitter:title" content="Осенняя ферма" />
    <meta name="twitter:description" content="Уютный вечерний огород с енотом: посади, полей, собери урожай и открой новые семена. Играется в браузере — на компьютере и телефоне." />
    <meta name="twitter:image" content="https://p4rzifalus.github.io/osennyaya-ferma-2/og-image.jpg" />
    <style>
      /* Шрифт заголовков (SIL Open Font License, файл лицензии рядом) */
      @font-face {
        font-family: 'Brahms Gotisch Cyr';
        src: url('fonts/BrahmsGotischCyr.otf') format('opentype');
        font-display: swap;
      }
      .title { font-family: 'Brahms Gotisch Cyr', Georgia, serif; font-weight: normal; letter-spacing: 0.02em; }

      /* Цвета интерфейса: тёмное вечернее стекло и тёплый янтарь */
      :root {
        --glass: rgba(24, 20, 34, 0.62);
        --glass-strong: rgba(24, 20, 34, 0.85);
        --edge: rgba(255, 214, 160, 0.18);
        --text: #f3e2c4;
        --text-dim: rgba(243, 226, 196, 0.6);
        --amber: #ffb45a;
        --amber-soft: rgba(255, 180, 90, 0.22);
      }

      html, body { margin: 0; height: 100%; background: #171722; overflow: hidden; }
      body { font-family: Menlo, Consolas, monospace; color: var(--text); }
      canvas { touch-action: none; } /* палец двигает сцену, а не страницу */

      /* Общая «стеклянная» панель: полупрозрачная, размывает то, что за ней */
      .toolbar button, .seed-row button, .shop, .hud, .daytime, .corner-bar button, .menu {
        background: var(--glass);
        border: 1px solid var(--edge);
        border-radius: 12px;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }

      /* Панель инструментов */
      .toolbar {
        position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
        display: flex; gap: 10px;
      }
      .toolbar button {
        position: relative; width: 72px; height: 72px; padding: 0;
        display: flex; align-items: center; justify-content: center; /* только значок и цифра клавиши */
        font: inherit; font-size: 13px; color: var(--text-dim); cursor: pointer;
        transition: color 0.15s, background 0.15s, border-color 0.15s, transform 0.15s;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      .toolbar button:hover { color: var(--text); }
      .toolbar button.selected {
        color: var(--amber); background: var(--glass-strong); border-color: var(--amber);
        box-shadow: 0 0 18px var(--amber-soft), 0 6px 24px rgba(0, 0, 0, 0.35);
        transform: translateY(-3px);
      }
      .toolbar .pixel-icon { width: 36px; height: 36px; fill: currentColor; } /* 3 точки на пиксель значка */
      .toolbar .key { position: absolute; top: 4px; left: 7px; font-size: 10px; opacity: 0.55; }
      .toolbar .count { position: absolute; top: 4px; right: 7px; font-size: 11px; color: var(--text); } /* «1/2» на корзинке */
      .toolbar .count.full { color: var(--amber); }

      /* Ряд семян над панелью */
      .seed-row {
        position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%);
        display: none; gap: 8px; width: max-content; max-width: min(720px, calc(100vw - 16px)); padding: 4px;
        flex-wrap: wrap-reverse; justify-content: center; /* много семян — переносятся на строку выше */
      }
      .seed-row.visible { display: flex; }
      .seed-row button {
        flex: none; height: 40px; padding: 0 14px; font: inherit; font-size: 13px;
        color: var(--text-dim); cursor: pointer; border-radius: 20px; touch-action: manipulation;
      }
      .seed-row button b { color: var(--text); font-weight: normal; margin-left: 4px; }
      .seed-row button.selected { color: var(--amber); border-color: var(--amber); box-shadow: 0 0 14px var(--amber-soft); }

      /* Магазин */
      .shop-backdrop {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        padding: 16px; background: rgba(12, 10, 20, 0.55);
      }
      .shop-backdrop.visible { display: flex; }
      .shop { width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; background: var(--glass-strong); }
      .shop-head {
        display: flex; justify-content: space-between; align-items: center;
        padding: 14px 18px; font-size: 30px; color: var(--amber); border-bottom: 1px solid var(--edge);
      }
      .shop-close {
        width: 40px; height: 40px; font: inherit; font-size: 16px; border-radius: 50%;
        color: var(--text-dim); background: none; border: 1px solid var(--edge); cursor: pointer;
      }
      .shop-close:hover { color: var(--text); }
      .shop-section { padding: 12px 18px 0; font-size: 15px; color: var(--amber); opacity: 0.8; }
      .shop-row { padding: 14px 18px; border-bottom: 1px solid var(--edge); }
      .shop-row:last-child { border-bottom: none; }
      .shop-row.locked { opacity: 0.45; }
      .shop-name { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
      .shop-name .title { font-size: 24px; color: var(--text); }
      .shop-name .owned { font-size: 12px; color: var(--text-dim); }
      .shop-info { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
      .shop-info.guard { color: #b8c6ff; } /* ночная роль — лунным цветом */
      .shop-buy { display: flex; gap: 8px; margin-top: 10px; }
      .shop-buy button {
        flex: 1; height: 40px; font: inherit; font-size: 13px; border-radius: 10px; cursor: pointer;
        color: #2a1a0a; background: var(--amber); border: none; touch-action: manipulation;
      }
      /* карточка растения в магазине: картинка слева, справа название, значки, кнопки */
      .seed-card { display: flex; gap: 12px; align-items: center; }
      .seed-card.locked { opacity: 0.75; }
      .seed-body { flex: 1; min-width: 0; }
      .plant-pic { width: 64px; height: 80px; image-rendering: pixelated; flex: none; margin: -8px 0; }
      .plant-pic.locked { filter: brightness(0); opacity: 0.55; }
      .stats { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin-top: 4px; font-size: 13px; color: var(--text-dim); }
      .stat { display: inline-flex; align-items: center; gap: 4px; }
      .stat .pixel-icon { width: 16px; height: 16px; fill: currentColor; }
      .stat.moons { gap: 1px; color: #b8c6ff; } /* ночи на страже — лунным цветом */
      .shop-name .stat { font-size: 13px; color: var(--text-dim); }
      .shop-buy button { display: inline-flex; align-items: center; gap: 4px; }
      .shop-buy button .pixel-icon, .tree-price .pixel-icon { width: 14px; height: 14px; fill: currentColor; }
      .tree-price { display: inline-flex; align-items: center; gap: 3px; }
      /* что нужно, чтобы открыть: маленькое растение и метки, сколько уже собрано */
      .unlock { display: flex; align-items: center; gap: 10px; }
      .unlock .plant-pic { width: 48px; height: 60px; margin: -6px 0; }
      .pips { display: flex; gap: 5px; }
      .pips i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--amber); opacity: 0.6; }
      .pips i.on { background: var(--amber); opacity: 1; box-shadow: 0 0 6px var(--amber-soft); }
      /* гербарий: родители гибрида */
      .parents { display: flex; align-items: center; justify-content: center; gap: 2px; color: var(--text-dim); }
      .parents .plant-pic { width: 32px; height: 40px; margin: 0; }
      .herb-card .stats { justify-content: center; }
      /* вкладки магазина: за монеты / за огоньки */
      .shop-tabs { display: flex; gap: 8px; padding: 12px 18px 0; }
      .shop-tabs button {
        flex: 1; padding: 6px 0; display: flex; justify-content: center; color: var(--text-dim); cursor: pointer; touch-action: manipulation;
        background: rgba(255, 255, 255, 0.04); border: 1px solid var(--edge); border-radius: 10px;
      }
      .shop-tabs .pixel-icon { width: 24px; height: 24px; fill: currentColor; }
      .shop-tabs button.selected { color: var(--amber); border-color: var(--amber); box-shadow: 0 0 14px var(--amber-soft); }
      /* дерево улучшений: ветка — цепочка шагов, слева — линия, по которой «течёт» свет купленных */
      .tree { position: relative; margin: 6px 18px 4px 30px; }
      .tree::before { content: ''; position: absolute; left: -12px; top: 18px; bottom: 18px; width: 2px; background: var(--edge); }
      .tree-step { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 0; }
      .tree-step::before {
        content: ''; position: absolute; left: -17px; top: 50%; width: 10px; height: 10px; margin-top: -6px;
        border-radius: 50%; border: 1px solid var(--edge); background: var(--glass-strong);
      }
      .tree-step.owned::before { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 10px var(--amber); }
      .tree-step.available::before { border-color: var(--amber); }
      .tree-step.locked { opacity: 0.45; }
      .tree-text { flex: 1; display: flex; flex-direction: column; }
      .tree-text .title { font-size: 20px; color: var(--text); }
      .tree-step.owned .title { color: var(--amber); }
      .tree-step .shop-buy { margin-top: 0; }
      .tree-done, .tree-price { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
      /* гербарий: сетка карточек; неоткрытые — тёмный силуэт */
      .herb-count { flex: 1; margin-left: 12px; font-size: 15px; color: var(--text-dim); font-family: Menlo, Consolas, monospace; }
      .herb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding: 14px 18px 18px; }
      .herb-card { padding: 8px 10px 10px; border: 1px solid var(--edge); border-radius: 12px; background: rgba(255, 255, 255, 0.03); text-align: center; }
      .herb-card > .plant-pic { width: 96px; height: 120px; display: block; margin: -16px auto 0; } /* у рисунка пустой верх — поджимаем */
      .herb-card .title { font-size: 20px; color: var(--text); margin-bottom: 4px; }
      .herb-card.locked .title { color: var(--text-dim); }
      .shop-buy button:disabled { color: var(--text-dim); background: rgba(255, 255, 255, 0.06); cursor: default; }

      /* Монеты и подсказки */
      .hud { position: fixed; top: 12px; right: 12px; padding: 4px 14px 6px; font-size: 24px; color: var(--amber); display: flex; gap: 14px; }
      .hud span { display: inline-flex; align-items: center; gap: 5px; }
      .hud .pixel-icon { width: 20px; height: 20px; fill: currentColor; }
      .hud .embers { color: #ffcf8a; } /* огоньки — рядом с монетами */
      /* Время суток — под монетами */
      .daytime {
        position: fixed; top: 58px; right: 12px; padding: 5px 10px 7px; display: grid;
        grid-template-columns: auto auto; column-gap: 7px; align-items: center; color: var(--amber);
      }
      .daytime-icon .pixel-icon { width: 20px; height: 20px; fill: currentColor; display: block; }
      .daytime-bar { grid-column: 1 / -1; height: 3px; margin-top: 5px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
      .daytime-bar i { display: block; height: 100%; background: currentColor; opacity: 0.7; }
      .daytime[data-phase='night'] { color: #b8c6ff; }
      body.intro .daytime { display: none; }

      /* Подсказки без слов над миром (popups.js): пузырь мысли над енотом и всплывающие числа */
      .popups { position: fixed; inset: 0; pointer-events: none; }
      .thought {
        position: fixed; transform: translate(-50%, -100%) scale(0.4); transform-origin: 50% 100%; opacity: 0;
        padding: 7px 9px; border-radius: 16px; color: var(--amber);
        background: var(--glass-strong); border: 1px solid var(--edge); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.6, 1), opacity 0.18s;
      }
      .thought.visible { transform: translate(-50%, -100%) scale(1); opacity: 1; }
      .thought .pixel-icon { width: 26px; height: 26px; fill: currentColor; display: block; }
      /* хвостик пузыря — два кружочка к голове */
      .thought::before, .thought::after {
        content: ''; position: absolute; border-radius: 50%; background: var(--glass-strong); border: 1px solid var(--edge);
      }
      .thought::before { width: 8px; height: 8px; left: 50%; bottom: -10px; margin-left: -6px; }
      .thought::after { width: 5px; height: 5px; left: 50%; bottom: -17px; margin-left: -1px; }
      .float {
        position: fixed; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 3px;
        font-size: 22px; color: var(--amber); text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6); white-space: nowrap;
      }
      .float .pixel-icon { width: 16px; height: 16px; fill: currentColor; }
      /* кнопка магазина зовёт: есть новые семена или хватает монет на новое */
      @keyframes beckon { 0%, 100% { box-shadow: 0 0 0 var(--amber-soft); } 50% { box-shadow: 0 0 22px var(--amber), 0 0 0 2px var(--amber-soft); color: var(--amber); } }
      .toolbar button.beckon:not(.selected) { animation: beckon 1.6s ease-in-out infinite; }
      /* мешочек семян летит из корзины к магазину */
      .fly-seed { position: fixed; color: var(--amber); pointer-events: none; transition: transform 0.9s cubic-bezier(0.5, -0.4, 0.6, 1), opacity 0.9s; }
      .fly-seed .pixel-icon { width: 28px; height: 28px; fill: currentColor; filter: drop-shadow(0 0 6px var(--amber)); }

      /* Реплика Джека: внизу, над панелью инструментов (или над рядом семян), печатается по буквам */
      .jack {
        position: fixed; left: 50%; bottom: 110px; transform: translate(-50%, 8px); opacity: 0;
        width: max-content; max-width: min(560px, calc(100vw - 32px)); padding: 8px 16px 10px;
        background: var(--glass-strong); border: 1px solid var(--edge); border-radius: 14px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); cursor: pointer; pointer-events: none;
        transition: opacity 0.25s, transform 0.25s;
      }
      .jack.visible { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
      .jack.paused { opacity: 0; pointer-events: none; }
      .jack-name { font-size: 18px; color: var(--amber); line-height: 1.1; }
      .jack-text { font-size: 14px; color: var(--text); line-height: 1.45; min-height: 1.45em; }
      .jack-rest { visibility: hidden; }

      /* Замеры скорости (?stats): счётчик сверху посередине и итог замера сцены */
      .stats-box {
        position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 50; pointer-events: none;
        padding: 5px 10px; border-radius: 8px; background: rgba(0, 0, 0, 0.6); color: #cfe9c4; font-size: 11px; line-height: 1.4; text-align: center;
      }
      .stats-box b { font-size: 14px; color: #fff; }
      .stats-result {
        position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px;
        background: rgba(10, 8, 16, 0.82); color: var(--text); padding: 16px;
      }
      .stats-result .title { font-size: 30px; color: var(--amber); }
      .stats-rows { width: min(340px, 100%); font-size: 15px; }
      .stats-rows div { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--edge); }
      .stats-rows b { font-weight: normal; color: var(--amber); }
      .stats-buttons { display: flex; gap: 10px; }
      .stats-buttons button { font: inherit; font-size: 15px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--edge); background: rgba(255, 255, 255, 0.08); color: var(--text); cursor: pointer; }

      /* Меню и камера — в левом верхнем углу */
      .corner-bar { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; }
      .corner-bar button {
        position: relative; width: 52px; height: 52px; padding: 0;
        display: flex; align-items: center; justify-content: center;
        color: var(--amber); cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        transition: color 0.15s, opacity 0.15s;
      }
      .corner-bar button:hover { color: var(--text); }
      .corner-bar .pixel-icon { width: 30px; height: 30px; fill: currentColor; }
      .corner-bar .key { position: absolute; top: 3px; left: 6px; font-size: 9px; color: var(--text-dim); }
      /* кнопки камеры — второй ряд под меню; включённая лупа светится, как выбранный инструмент */
      .view-bar { top: 72px; }
      .view-bar button { color: var(--text-dim); }
      .view-bar button.on, .corner-bar button.on {
        color: var(--amber); background: var(--glass-strong); border-color: var(--amber);
        box-shadow: 0 0 18px var(--amber-soft), 0 6px 24px rgba(0, 0, 0, 0.35);
      }
      @media (pointer: coarse) { .corner-bar .key { display: none; } } /* на телефоне клавиш нет */

      /* Стартовый экран и меню: окно поверх притушенной сцены */
      .menu-backdrop {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        padding: 16px; background: rgba(12, 10, 20, 0.5); z-index: 10;
      }
      .menu-backdrop.visible { display: flex; }
      body.intro .menu-backdrop { background: radial-gradient(ellipse at center, rgba(12, 10, 20, 0.25), rgba(12, 10, 20, 0.7)); }
      body.intro .toolbar, body.intro .seed-row, body.intro .hud, body.intro .corner-bar, body.intro .popups, body.intro .jack { display: none; }
      .menu {
        width: 100%; max-width: 380px; max-height: 100%; overflow-y: auto; padding: 18px;
        background: var(--glass-strong); box-sizing: border-box;
      }
      .menu-title { font-size: 46px; color: var(--amber); text-align: center; line-height: 1.1; }
      .menu-subtitle { text-align: center; font-size: 13px; color: var(--text-dim); margin: 6px 0 20px; }
      .menu-head { display: flex; justify-content: space-between; align-items: center; font-size: 30px; color: var(--amber); margin-bottom: 8px; }
      .menu-close {
        width: 40px; height: 40px; font: inherit; font-size: 16px; border-radius: 50%;
        color: var(--text-dim); background: none; border: 1px solid var(--edge); cursor: pointer;
      }
      .menu-section { padding: 12px 0; border-top: 1px solid var(--edge); }
      .menu-text { font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
      .menu-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
      .menu-buttons.column { flex-direction: column; }
      .menu-buttons button, .menu-sound .toggle {
        flex: 1; min-height: 48px; padding: 8px 14px; font: inherit; font-size: 14px; border-radius: 10px; cursor: pointer;
        color: var(--text); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--edge);
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      .menu-buttons button:hover, .menu-sound .toggle:hover { border-color: var(--amber); }
      .menu-buttons button.primary { color: #2a1a0a; background: var(--amber); border-color: var(--amber); }
      .menu-buttons button small { display: block; font-size: 11px; opacity: 0.7; margin-top: 2px; }
      .menu-buttons button.link { min-height: 0; padding: 0 0 4px; background: none; border: none; font-size: 12px; color: var(--text-dim); text-decoration: underline; }
      .menu-buttons button[hidden] { display: none; }
      .menu-sound { display: flex; align-items: center; gap: 12px; margin: 6px 0; }
      .menu-sound .toggle { flex: none; width: 150px; text-align: left; color: var(--text-dim); }
      .menu-sound .toggle.on { color: var(--amber); }
      .menu-sound input { flex: 1; accent-color: var(--amber); height: 28px; }
      .menu-sound input.dim { opacity: 0.4; }
      .menu-report { margin: 14px 0 18px; font-size: 14px; }
      .menu-discovery { display: flex; justify-content: center; margin: 4px 0 6px; }
      .menu-discovery img { width: 128px; height: 160px; image-rendering: pixelated; filter: drop-shadow(0 0 18px var(--amber-soft)); }
      .menu-parents { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 10px 0 4px; color: var(--text-dim); font-size: 20px; }
      .menu-parents img { width: 48px; height: 60px; image-rendering: pixelated; }
