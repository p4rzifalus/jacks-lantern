<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Jack’s Lantern</title>
    <meta name="description" content="Уютный вечерний огород с енотом: посади, полей, собери урожай и открой новые семена. Играется в браузере — на компьютере и телефоне." />

    <!-- Иконки вкладки и домашнего экрана телефона — фонарь Джек (собираются скриптом: npm run icons) -->
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Jack’s Lantern" />
    <meta name="theme-color" content="#171722" />

    <!-- Превью ссылки в соцсетях и мессенджерах (картинка — полный адрес, так требуют соцсети) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jack’s Lantern" />
    <meta property="og:title" content="Jack’s Lantern" />
    <meta property="og:description" content="Уютный вечерний огород с енотом: посади, полей, собери урожай и открой новые семена. Играется в браузере — на компьютере и телефоне." />
    <meta property="og:url" content="https://p4rzifalus.github.io/jacks-lantern/" />
    <meta property="og:image" content="https://p4rzifalus.github.io/jacks-lantern/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Вечерний остров с огородом, домиком и фонарями" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jack’s Lantern" />
    <meta name="twitter:description" content="Уютный вечерний огород с енотом: посади, полей, собери урожай и открой новые семена. Играется в браузере — на компьютере и телефоне." />
    <meta name="twitter:image" content="https://p4rzifalus.github.io/jacks-lantern/og-image.jpg" />
    <style>
      /* Шрифт интерфейса — Alegreya и Alegreya SC (SIL Open Font License, файл лицензии рядом).
         Остальные стили интерфейса — src/ui.css */
      @font-face {
        font-family: 'Alegreya'; font-weight: 400 900; font-display: swap;
        src: url('fonts/Alegreya-cyrillic.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: 'Alegreya'; font-weight: 400 900; font-display: swap;
        src: url('fonts/Alegreya-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Alegreya SC'; font-weight: 700; font-display: swap;
        src: url('fonts/AlegreyaSC-Bold-cyrillic.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: 'Alegreya SC'; font-weight: 700; font-display: swap;
        src: url('fonts/AlegreyaSC-Bold-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      html, body { margin: 0; height: 100%; background: #171722; overflow: hidden; }
      canvas { touch-action: none; } /* палец двигает сцену, а не страницу */
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
